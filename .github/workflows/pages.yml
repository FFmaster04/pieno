name: Prezzi giornalieri e sito
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily publication plus one retry for late MIMIT publication. UTC.
    - cron: '23 8,14 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scarica e valida i dati MIMIT
        env:
          PREVIOUS_SNAPSHOT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/initial.json
          SNAPSHOT_FEED_URL: ${{ vars.SNAPSHOT_FEED_URL }}
        run: node scripts/update-data.mjs
      - name: Conserva lo storico delle medie
        run: node scripts/record-history.mjs
      - name: Installa dipendenze
        run: npm ci --no-audit --no-fund
      - name: Verifica ricerca e tipi
        run: |
          npm run check-search
          npm run check-experience
          npm run check-update
          npm run check-cloudflare
          node scripts/check-feed.mjs
          node node_modules/typescript/bin/tsc --noEmit
      - name: Crea il sito statico
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Registra il controllo giornaliero
        run: |
          node scripts/record-update.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data-status.json public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Registra controllo MIMIT e storico medie"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
          retention-days: 1
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
