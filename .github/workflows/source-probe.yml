name: Diagnosi collegamento fonte
on:
  push:
    paths:
      - scripts/probe-source.mjs
      - .github/workflows/source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-source.mjs
