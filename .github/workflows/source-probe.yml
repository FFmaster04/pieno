name: Diagnosi collegamento fonte
on:
  push:
    paths:
      - scripts/probe-source.mjs
      - .github/workflows/source-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        descriptors: [1, 0]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installa collegamento libero di riserva
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tor
      - name: Verifica HTTPS della fonte con uscita italiana
        run: |
          tor --RunAsDaemon 1 --ClientOnly 1 --SocksPort 127.0.0.1:9052 --ExitNodes '{it}' --StrictNodes 1 --ClientUseIPv6 0 --ReachableAddresses '*:80,*:443' --UseMicrodescriptors '${{ matrix.descriptors }}' --DataDirectory "$RUNNER_TEMP/pieno-tor" --Log "notice file $RUNNER_TEMP/pieno-tor.log"
          for i in $(seq 1 100); do
            if grep -q 'Bootstrapped 100%' "$RUNNER_TEMP/pieno-tor.log"; then break; fi
            sleep 2
          done
          tail -15 "$RUNNER_TEMP/pieno-tor.log"
          if ! grep -q 'Bootstrapped 100%' "$RUNNER_TEMP/pieno-tor.log"; then exit 1; fi
          for file in anagrafica_impianti_attivi.csv prezzo_alle_8.csv; do
            curl --silent --show-error --fail --location --proto '=https' --proto-redir '=https' --socks5-hostname 127.0.0.1:9052 --connect-timeout 45 --max-time 120 "https://www.mimit.gov.it/images/exportCSV/$file" --output "$RUNNER_TEMP/$file"
            head -2 "$RUNNER_TEMP/$file"
            sha256sum "$RUNNER_TEMP/$file"
            wc -c "$RUNNER_TEMP/$file"
          done
